<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0e1a1f">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- Link-Vorschau (WhatsApp/Telegram/etc.) -->
<meta property="og:title" content="Kratos' Watchlist">

<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0e1a1f; overflow: hidden; }
  iframe {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: none;
  }
</style>
</head>
<body>
  <!--
    WICHTIG: Ersetze die URL unten durch deine eigene Web-App-URL
    (Apps-Script-Editor -> Bereitstellen -> Bereitstellungen verwalten -> Web-App-URL,
    endet auf ".../exec").
  -->
  <iframe src="HIER_DEINE_EXEC_URL_EINFUEGEN" allow="clipboard-write"></iframe>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function () {
          // Offline-Fallback ist optional – bei Fehlschlag läuft die App einfach normal weiter.
        });
      });
    }
  </script>
</body>
</html>
